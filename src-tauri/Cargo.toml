[package]
name = "fast-mode"
version = "2.0.1"
edition = "2021"
license = "MIT"

[lib]
name = "fast_mode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Native one-shot window resize on macOS (avoids the size-then-move flicker).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow", "NSScreen", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["std", "NSGeometry", "NSArray"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebViewConfiguration"] }
