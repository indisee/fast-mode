<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fast Mode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="card" class="compact" data-tauri-drag-region>
    <div id="box">
      <textarea id="input" rows="1" spellcheck="false" autocorrect="off" autocapitalize="off"
                autocomplete="off" writingsuggestions="false" placeholder=" "></textarea>
    </div>

    <div id="footer" data-tauri-drag-region>
      <button id="gear" class="icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
      </button>

      <div id="status" aria-live="polite"></div>

      <button id="copy" class="icon" title="Copy last response again" aria-label="Copy last response" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="8" width="12" height="13" rx="2"/>
          <path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/>
        </svg>
      </button>
    </div>

    <div id="busy" title="Thinking… Click or press Esc to cancel"><div class="spinner big"></div></div>
    <div id="error" hidden></div>
    <div id="history-head" hidden>
      <span id="history-title"></span>
      <button id="history-hide" class="text-btn">Hide</button>
    </div>
    <div id="history" hidden></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
